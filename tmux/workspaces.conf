# Format: session | window index | window name | working directory | startup command
# Paths beginning with ~/ are expanded. Blank command = interactive zsh.
# Existing sessions/windows are never overwritten or restarted.
# One session per project, with zsh at index 0 and each OpenCode agent in its own window.
vim-tutor|0|shell|~/code/vim-tutor
vim-tutor|1|product|~/code/vim-tutor|opencode
vim-tutor|2|plugin|~/code/vim-tutor-worktrees/plugin|opencode
vim-tutor|3|curriculum|~/code/vim-tutor-worktrees/curriculum|opencode
vim-tutor|4|backend|~/code/vim-tutor-worktrees/local-store|opencode
vim-tutor|5|dashboard|~/code/vim-tutor-worktrees/native-ux|opencode
vim-tutor|6|api|~/code/vim-tutor-worktrees/api|opencode
vim-tutor|7|web|~/code/vim-tutor-worktrees/web|opencode

